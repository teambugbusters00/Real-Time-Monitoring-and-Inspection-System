name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'static/nirikshan_logo.jpg'
      - '.github/workflows/android-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No package-lock.json is committed yet, so do not enable npm cache here.

      - name: Install dependencies
        run: npm install

      - name: Create web placeholder
        run: mkdir -p www && printf '<!doctype html><html><head><meta charset="utf-8"><title>Nirikshan</title></head><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare Nirikshan logo assets
        run: |
          mkdir -p resources
          convert static/nirikshan_logo.jpg resources/logo.png

      - name: Generate Android app icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#082b59' --iconBackgroundColorDark '#082b59' --splashBackgroundColor '#082b59' --splashBackgroundColorDark '#082b59'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nirikshan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
